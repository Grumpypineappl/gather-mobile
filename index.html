/* ===== v0.7 — FİNAL MOBİL DENEYİM ===== */
:root{--muted:#665f7d;--pos:#127a61;--neg:#c4366a}
.pos{color:var(--pos)}.neg{color:var(--neg)}.sub{color:var(--muted)}
/* Net bakiye kartı — koyu, yüksek kontrastlı fintech kartı */
.balanceCard{background:linear-gradient(135deg,#2a2150 0%,#4a35b4 62%,#5d45d6 100%);box-shadow:0 18px 40px rgba(58,40,150,.28);position:relative;overflow:hidden}
.balanceCard::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(99,206,181,.35),transparent 70%);pointer-events:none}
.balanceCard .balBox{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14)}
.bcLabel,.balanceCard>small,.balBox span{opacity:1;color:#e6e0ff}
/* Ekran geçişleri (hafif) */
.view.active{animation:viewIn .2s ease-out both}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* İstatistikler */
.statGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.statCard h4{margin:0 0 2px;font-size:15px}
.statEmpty{margin-top:14px;padding:22px 12px;text-align:center;color:var(--muted);font-size:13px;background:#f7f5fb;border-radius:14px}

.mBar small{font-size:11px;color:var(--muted);font-weight:700}
.mVal{font-size:9.5px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hBars{display:grid;gap:12px;margin-top:12px}
.hBar{display:grid;gap:5px;min-width:0}
.hBtn{border:0;background:none;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.hLbl{display:flex;justify-content:space-between;gap:8px;font-size:13px}.hLbl span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hLbl b{white-space:nowrap;font-size:12px}
.hTrack{position:relative;height:10px;border-radius:6px;background:#efecf5;overflow:hidden}

.segTabs.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.segTabs button{line-height:1.2}
.payRow strong{white-space:nowrap}

.gHead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.gHead h4{margin:0;min-width:0;overflow-wrap:anywhere}

.pGrid{margin-top:14px}
/* Klavye açıkken alt menüyü gizle */
body.kbd .mnav{display:none!important}

<script id="gather-engine">
/* ===== GATHER HESAPLAMA MOTORU (Faz 2) =====
   - Tüm tutarlar KURUŞ cinsinden tam sayıdır (100 = 1,00 TL).
   - Fonksiyonlar saf (pure) çalışır: DOM'a ve localStorage'a dokunmaz.
   - Borçlar her zaman GRUP BAZINDA ve İKİ KİŞİ ARASINDA (pairwise) tutulur.
   - Harcama kaynaklı borçlar ile ödeme kayıtları ayrı izlenir; kalan borç = harcama borcu - ödemeler.
*/
(function (root) {
  'use strict';
  var NO_GROUP = '_grupsuz';
  var scopeOf = function (groupId) { return groupId || NO_GROUP; };
  var isInt = function (n) { return typeof n === 'number' && Number.isInteger(n); };

  /* "1234.56", "1234,56", "1.234,56", 12.5 -> kuruş (int). Geçersizse null. */
  function toCents(v) {
    if (v === null || v === undefined) return null;
    var s = String(v).trim().replace(/\s/g, '').replace(/₺|TL/gi, '');
    if (!s) return null;
    if (s.indexOf('.') > -1 && s.indexOf(',') > -1) s = s.replace(/\./g, '').replace(',', '.');
    else if (s.indexOf(',') > -1) s = s.replace(',', '.');
    if (/e/i.test(s)) { var n = Number(s); if (!isFinite(n)) return null; s = n.toFixed(2); }
    var m = /^(-)?(\d+)(?:\.(\d{1,2}))?$/.exec(s);
    if (!m) return null;
    var c = Number(m[2]) * 100 + Number(((m[3] || '') + '00').slice(0, 2));
    if (!Number.isSafeInteger(c)) return null;
    return m[1] ? -c : c;
  }

  /* Toplamı n kişiye kuruş kaybetmeden böler. Artan kuruşlar ilk katılımcılara 1'er kuruş eklenir. */
  function splitEqual(total, n) {
    if (!isInt(total) || total <= 0 || !isInt(n) || n <= 0) throw new Error('splitEqual: geçersiz tutar veya kişi sayısı');
    var q = Math.floor(total / n), r = total - q * n, out = [];
    for (var i = 0; i < n; i++) out.push(q + (i < r ? 1 : 0));
    return out;
  }

  /* Harcama doğrulama. opts.groupMembers verilirse ödeyen/katılımcıların grup üyesi olması kontrol edilir. */
  function validateExpense(e, opts) {
    opts = opts || {};
    var errs = [];
    if (!e || typeof e !== 'object') return ['Harcama kaydı yok'];
    if (!e.id) errs.push('Harcama ID eksik');
    if (!isInt(e.amount) || e.amount <= 0) errs.push('Tutar sıfırdan büyük olmalı');
    if (!e.payer) errs.push('Ödeyen kişi seçilmeli');
    var p = Array.isArray(e.participants) ? e.participants : [];
    var s = Array.isArray(e.splits) ? e.splits : [];
    if (!p.length) errs.push('En az bir katılımcı seçilmeli');
    if (new Set(p).size !== p.length) errs.push('Aynı katılımcı birden fazla kez seçilmiş');
    if (s.length !== p.length) errs.push('Pay sayısı katılımcı sayısıyla eşleşmiyor');
    if (s.some(function (x) { return !isInt(x) || x < 0; })) errs.push('Paylar sıfır veya pozitif tam kuruş olmalı');
    var sum = s.reduce(function (a, x) { return a + (isInt(x) ? x : 0); }, 0);
    if (isInt(e.amount) && sum !== e.amount) errs.push('Payların toplamı (' + sum + ' kuruş) tutara (' + e.amount + ' kuruş) eşit değil');
    if (e.type === 'shared' && !e.groupId) errs.push('Ortak harcama bir gruba bağlı olmalı');
    if (opts.groupMembers) {
      var gm = opts.groupMembers;
      if (e.payer && gm.indexOf(e.payer) === -1) errs.push('Ödeyen kişi grup üyesi değil');
      if (p.some(function (id) { return gm.indexOf(id) === -1; })) errs.push('Grup üyesi olmayan katılımcı var');
    }
    return errs;
  }

  function validatePayment(p) {
    var errs = [];
    if (!p || typeof p !== 'object') return ['Ödeme kaydı yok'];
    if (!p.id) errs.push('Ödeme ID eksik');
    if (!isInt(p.amount) || p.amount <= 0) errs.push('Ödeme tutarı sıfırdan büyük olmalı');
    if (!p.from || !p.to) errs.push('Ödeyen ve alan seçilmeli');
    if (p.from && p.from === p.to) errs.push('Kişi kendisine ödeme yapamaz');
    return errs;
  }

  /* Bir harcamadan doğan borç kalemleri: her katılımcı (ödeyen hariç) payı kadar ödeyene borçlanır. */
  function expenseDebts(e) {
    if (!e || e.type !== 'shared') return [];
    var out = [];
    e.participants.forEach(function (id, i) {
      var share = e.splits[i];
      if (id !== e.payer && share > 0) out.push({ groupId: scopeOf(e.groupId), from: id, to: e.payer, amount: share, expenseId: e.id });
    });
    return out;
  }

  /* Geçerli ve tekilleştirilmiş kayıtlar (aynı ID iki kez sayılmaz). */
  function cleanRecords(state) {
    var seenE = {}, seenP = {}, expenses = [], payments = [], invalid = [];
    (state.expenses || []).forEach(function (e) {
      if (e && seenE[e.id]) { invalid.push({ kind: 'expense', id: e.id, title: e.title, errors: ['Aynı ID ile tekrar eden harcama — yalnızca ilki sayıldı'] }); return; }
      var errs = validateExpense(e);
      if (errs.length) { invalid.push({ kind: 'expense', id: e && e.id, title: e && e.title, errors: errs }); return; }
      seenE[e.id] = 1; expenses.push(e);
    });
    (state.payments || []).forEach(function (p) {
      if (p && seenP[p.id]) { invalid.push({ kind: 'payment', id: p.id, errors: ['Aynı ID ile tekrar eden ödeme — yalnızca ilki sayıldı'] }); return; }
      var errs = validatePayment(p);
      if (errs.length) { invalid.push({ kind: 'payment', id: p && p.id, errors: errs }); return; }
      seenP[p.id] = 1; payments.push(p);
    });
    return { expenses: expenses, payments: payments, invalid: invalid };
  }

  /* Grup + kişi çifti bazında defter. key = scope|a|b (a<b) */
  function buildLedger(state) {
    var rec = cleanRecords(state), L = {};
    function slot(scope, x, y) {
      var a = x < y ? x : y, b = x < y ? y : x, k = scope + '|' + a + '|' + b;
      if (!L[k]) L[k] = { groupId: scope, a: a, b: b, owedAB: 0, owedBA: 0, paidAB: 0, paidBA: 0 };
      return L[k];
    }
    rec.expenses.forEach(function (e) {
      expenseDebts(e).forEach(function (d) {
        var s = slot(d.groupId, d.from, d.to);
        if (d.from === s.a) s.owedAB += d.amount; else s.owedBA += d.amount;
      });
    });
    rec.payments.forEach(function (p) {
      var s = slot(scopeOf(p.groupId), p.from, p.to);
      if (p.from === s.a) s.paidAB += p.amount; else s.paidBA += p.amount;
    });
    return { ledger: L, invalid: rec.invalid };
  }

  /* Netleştirilmiş borçlar: [{groupId, from, to, amount, owed, paid}] — amount > 0 olanlar.
     filter: {groupId, userId} opsiyonel. */
  function pairDebts(state, filter) {
    filter = filter || {};
    var L = buildLedger(state).ledger, out = [];
    Object.keys(L).forEach(function (k) {
      var s = L[k];
      if (filter.groupId !== undefined && s.groupId !== scopeOf(filter.groupId)) return;
      if (filter.userId && s.a !== filter.userId && s.b !== filter.userId) return;
      var netAB = (s.owedAB - s.paidAB) - (s.owedBA - s.paidBA); // >0: a, b'ye borçlu
      if (netAB === 0) return;
      var from = netAB > 0 ? s.a : s.b, to = netAB > 0 ? s.b : s.a;
      out.push({
        groupId: s.groupId === NO_GROUP ? null : s.groupId, from: from, to: to, amount: Math.abs(netAB),
        owed: from === s.a ? s.owedAB : s.owedBA,        // borçlunun harcamalardan doğan brüt borcu
        counterOwed: from === s.a ? s.owedBA : s.owedAB, // karşı tarafın borcu (netleştirilen)
        paid: from === s.a ? s.paidAB : s.paidBA,        // borçlunun yaptığı ödemeler
        counterPaid: from === s.a ? s.paidBA : s.paidAB
      });
    });
    return out.sort(function (x, y) { return y.amount - x.amount; });
  }

  /* İki kişi arasındaki borç (grup bazında). >0: from, to'ya borçlu. */
  function debtBetween(state, from, to, groupId) {
    var d = pairDebts(state, { groupId: groupId || null }).filter(function (x) {
      return (x.from === from && x.to === to) || (x.from === to && x.to === from);
    })[0];
    if (!d) return 0;
    return d.from === from ? d.amount : -d.amount;
  }

  /* Kişi başı net bakiye (bağımsız yöntemle): + alacaklı, - borçlu. groupId undefined => tüm kapsamlar ayrı ayrı döner. */
  function netBalances(state, groupId) {
    var rec = cleanRecords(state), out = {};
    function add(scope, id, n) { out[scope] = out[scope] || {}; out[scope][id] = (out[scope][id] || 0) + n; }
    rec.expenses.forEach(function (e) {
      if (e.type !== 'shared') return;
      var sc = scopeOf(e.groupId);
      e.participants.forEach(function (id, i) {
        if (id === e.payer) return;
        add(sc, e.payer, e.splits[i]); add(sc, id, -e.splits[i]);
      });
    });
    rec.payments.forEach(function (p) { var sc = scopeOf(p.groupId); add(sc, p.from, p.amount); add(sc, p.to, -p.amount); });
    if (groupId !== undefined) return out[scopeOf(groupId)] || {};
    return out;
  }

  /* Bütünlük kontrolü: her grupta net bakiyeler toplamı 0 mı ve iki yöntem aynı sonucu veriyor mu? */
  function checkIntegrity(state) {
    var all = netBalances(state), debts = pairDebts(state), report = [];
    Object.keys(all).forEach(function (sc) {
      var bal = all[sc], sum = 0, fromPairs = {};
      Object.keys(bal).forEach(function (id) { sum += bal[id]; });
      debts.filter(function (d) { return scopeOf(d.groupId) === sc; }).forEach(function (d) {
        fromPairs[d.to] = (fromPairs[d.to] || 0) + d.amount; fromPairs[d.from] = (fromPairs[d.from] || 0) - d.amount;
      });
      var consistent = Object.keys(bal).every(function (id) { return (bal[id] || 0) === (fromPairs[id] || 0); });
      report.push({ groupId: sc === NO_GROUP ? null : sc, sum: sum, zeroSum: sum === 0, consistent: consistent });
    });
    return { ok: report.every(function (r) { return r.zeroSum && r.consistent; }), groups: report };
  }

  /* Bir kullanıcının özeti. Gruplar birleştirilmez: alacak ve borç ayrı toplanır. */
  function userSummary(state, userId) {
    var debts = pairDebts(state, { userId: userId }), receivable = 0, payable = 0;
    debts.forEach(function (d) { if (d.to === userId) receivable += d.amount; else payable += d.amount; });
    return { receivable: receivable, payable: payable, net: receivable - payable, debts: debts };
  }

  /* Kullanıcı ile başka bir kişi arasında, grup grup durum. */
  function friendBalance(state, me, other) {
    var byGroup = pairDebts(state).filter(function (d) {
      return (d.from === me && d.to === other) || (d.from === other && d.to === me);
    }).map(function (d) { return { groupId: d.groupId, amount: d.to === me ? d.amount : -d.amount }; });
    var receivable = 0, payable = 0;
    byGroup.forEach(function (g) { if (g.amount > 0) receivable += g.amount; else payable += -g.amount; });
    return { receivable: receivable, payable: payable, byGroup: byGroup };
  }

  function audit(state) { return buildLedger(state).invalid; }

  root.GatherEngine = {
    NO_GROUP: NO_GROUP, toCents: toCents, splitEqual: splitEqual, validateExpense: validateExpense,
    validatePayment: validatePayment, expenseDebts: expenseDebts, pairDebts: pairDebts, debtBetween: debtBetween,
    netBalances: netBalances, checkIntegrity: checkIntegrity, userSummary: userSummary, friendBalance: friendBalance, audit: audit
  };

  /* ===== TESTLER — tarayıcı konsolunda: GatherTests.run()  (gerçek verilere DOKUNMAZ) ===== */
  function T() {
    var E = root.GatherEngine;
    var B = 'buket', A = 'adem', D = 'damla', L = 'aleyna';
    var n = 0;
    function ex(amount, payer, parts, splits, g, type) {
      return { id: 'e' + (++n), title: 't', amount: amount, date: '2026-11-01', category: 'Diğer', type: type || 'shared', groupId: g === undefined ? 'g1' : g, payer: payer, participants: parts, splits: splits || E.splitEqual(amount, parts.length) };
    }
    function pay(from, to, amount, g) { return { id: 'p' + (++n), from: from, to: to, amount: amount, groupId: g || 'g1', date: '2026-11-01' }; }
    function S(expenses, payments) { return { expenses: expenses, payments: payments || [] }; }
    function eq(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
    function simple(st) { return E.pairDebts(st).map(function (d) { return d.from + '>' + d.to + ':' + d.amount; }).sort(); }
    var tests = [];
    function t(name, expected, actualFn) {
      var actual, pass;
      try { actual = actualFn(); pass = eq(actual, expected); } catch (err) { actual = 'HATA: ' + err.message; pass = false; }
      tests.push({ test: name, durum: pass ? 'PASS' : 'FAIL', beklenen: JSON.stringify(expected), gerceklesen: JSON.stringify(actual) });
    }
    var s1 = S([ex(300000, B, [B, A, D])]);
    t('TEST 1 — Üç kişilik eşit harcama', ['adem>buket:100000', 'damla>buket:100000'], function () { return simple(s1); });
    t('TEST 1b — Buket kendisine borçlu değil', 0, function () { return E.pairDebts(s1).filter(function (d) { return d.from === d.to; }).length; });
    var s2 = S([ex(550000, B, [L])]);
    t('TEST 2 — Tek katılımcı (Aleyna 5.500 TL)', ['aleyna>buket:550000'], function () { return simple(s2); });
    t('TEST 2b — Buket özeti: alacak 5.500, borç 0', [550000, 0], function () { var u = E.userSummary(s2, B); return [u.receivable, u.payable]; });
    t('TEST 2c — Aleyna arkadaş kartı (Buket gözünden)', { receivable: 550000, payable: 0 }, function () { var f = E.friendBalance(s2, B, L); return { receivable: f.receivable, payable: f.payable }; });
    t('TEST 3 — Ödeyen katılımcı değil', ['adem>buket:60000', 'damla>buket:60000'], function () { return simple(S([ex(120000, B, [A, D])])); });
    t('TEST 4 — Karşılıklı borç netleşir', ['adem>buket:60000'], function () { return simple(S([ex(100000, B, [A]), ex(40000, A, [B])])); });
    var s5 = S([ex(100000, B, [A])], [pay(A, B, 35000)]);
    t('TEST 5 — Kısmi ödeme: kalan 650 TL', ['adem>buket:65000'], function () { return simple(s5); });
    t('TEST 5b — Ödeme geçmişi ayrı tutulur (borç 1000 / ödenen 350)', { owed: 100000, paid: 35000 }, function () { var d = E.pairDebts(s5)[0]; return { owed: d.owed, paid: d.paid }; });
    t('TEST 6 — Kişisel harcama borç oluşturmaz', [], function () { return simple(S([ex(75000, B, [B], null, null, 'personal')])); });
    t('TEST 6b — Ortak ama tek katılımcı ödeyen', [], function () { return simple(S([ex(75000, B, [B])])); });
    t('TEST 7 — Özel paylaşım 200/300/500', ['adem>buket:30000', 'damla>buket:50000'], function () { return simple(S([ex(100000, B, [B, A, D], [20000, 30000, 50000])])); });
    t('TEST 8 — 100 TL / 3: paylar', [3334, 3333, 3333], function () { return E.splitEqual(10000, 3); });
    t('TEST 8b — 100 TL / 3: toplam tam 100 TL', 10000, function () { return E.splitEqual(10000, 3).reduce(function (a, b) { return a + b; }, 0); });
    t('TEST 8c — 100 TL / 3: bakiye toplamı 0', true, function () { return E.checkIntegrity(S([ex(10000, B, [B, A, D])])).ok; });
    var base = ex(90000, B, [B, A, D]);
    t('Silme — harcama silinince borç kalmaz', [], function () { var st = S([base]); st.expenses = st.expenses.filter(function (e) { return e.id !== base.id; }); return simple(st); });
    t('Düzenleme — eski tutar ikinci kez sayılmaz', ['adem>buket:40000', 'damla>buket:40000'], function () {
      var st = S([base]); var edited = Object.assign({}, base, { amount: 120000, splits: E.splitEqual(120000, 3) });
      st.expenses = st.expenses.map(function (e) { return e.id === base.id ? edited : e; }); return simple(st);
    });
    t('Çift kayıt — aynı ödeme ID iki kez düşülmez', ['adem>buket:65000'], function () { var p = pay(A, B, 35000); return simple(S([ex(100000, B, [A])], [p, p])); });
    t('Grup ayrımı — farklı gruplar birleşmez', ['adem>buket:100000', 'buket>adem:40000'], function () { return simple(S([ex(100000, B, [A], null, 'g1'), ex(40000, A, [B], null, 'g2')])); });
    t('Grup ayrımı — özet alacak/borç ayrı', [100000, 40000], function () { var u = E.userSummary(S([ex(100000, B, [A], null, 'g1'), ex(40000, A, [B], null, 'g2')]), B); return [u.receivable, u.payable]; });
    t('Dolaylı devir yok — Damla Buket\'e borçlandırılmaz', ['adem>buket:100000', 'damla>adem:100000'], function () { return simple(S([ex(100000, B, [A]), ex(100000, A, [D])])); });
    t('Bütünlük — karışık senaryoda grup toplamları 0', true, function () { return E.checkIntegrity(S([ex(300000, B, [B, A, D]), ex(10000, A, [B, D, L]), ex(100000, D, [B, A], [20000, 80000])], [pay(A, B, 35000)])).ok; });
    t('Doğrulama — eksik katılımcı engellenir', true, function () { return E.validateExpense(ex(1000, B, [B], [])).length > 0 && E.validateExpense({ id: 'x', amount: 1000, payer: B, participants: [], splits: [], type: 'shared', groupId: 'g1' }).length > 0; });
    t('Doğrulama — pay toplamı ≠ tutar engellenir', true, function () { return E.validateExpense(ex(1000, B, [A, D], [400, 500])).length > 0; });

/* ---------- VERİ YÜKLEME + MIGRATION ---------- */
function loadWorkspace(ws){
  KEY=KEYS[ws];session.workspace=ws;migrationNotice='';loadError=null;state=null;let raw;
  try{raw=localStorage.getItem(KEY)}catch(e){loadError={msg:'Tarayıcı depolamasına erişilemiyor: '+e.message};return false}
  if(ws==='demo'){
    if(!raw){state=GatherDemo.build();persistQuiet();return true}
    try{state=MIG.migrate(JSON.parse(raw),{addDemoUsers:false}).data;return true}catch(e){loadError={msg:'Demo verisi okunamadı.',raw,demo:true};return false}
  }
  if(!raw){state=MIG.migrate(structuredClone(seed)).data;return true} /* ilk açılış: ilk değişiklikte kaydedilir */
  let parsed;try{parsed=JSON.parse(raw)}catch{loadError={msg:'Kayıtlı Gather verisi okunamadı (JSON bozuk). Verine dokunulmadı.',raw};return false}
  try{
    if(parsed&&parsed.schemaVersion===MIG.VERSION){state=MIG.migrate(parsed).data;return true}
    const res=MIG.migrate(parsed),errs=MIG.verify(parsed,res.data);
    if(errs.length)throw Error(errs.join('; '));
    const bk=KEY+'__yedek_v'+(parsed.schemaVersion||1);if(!localStorage.getItem(bk))localStorage.setItem(bk,raw); /* her şema sürümü için migration öncesi ham yedek (bir kez) */
    localStorage.setItem(KEY,JSON.stringify(res.data));
    state=res.data;migrationNotice=`Verilerin yeni sürüme taşındı (${res.log.length} düzenleme). Önceki hali yedeklendi.`;return true
  }catch(e){loadError={msg:'Veri taşıma yapılamadı; mevcut verin DEĞİŞTİRİLMEDİ. Ayrıntı: '+e.message,raw};state=null;return false}
}
function persistQuiet(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch{return false}}
function save(msg){if(!persistQuiet()){render();return toast('Kaydedilemedi: tarayıcı depolama alanı dolu veya engelli')}render();if(msg)toast(msg)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
function deny(msg){toast('⛔ '+msg);return false}

const myGroups=()=>ACL.visibleGroups(state,ME()),myEvents=()=>ACL.visibleEvents(state,ME()),myExpenses=()=>ACL.visibleExpenses(state,ME());
const isAdmin=gid=>ACL.isGroupAdmin(state,ME(),gid);

function orderedProfiles(){const pri=['buket','adem','damla','aleyna'],r=u=>{const i=pri.indexOf(first(u.name).toLocaleLowerCase('tr'));return i<0?99:i};return Auth.profiles().slice().sort((a,b)=>r(a)-r(b))}
function renderAuth(view='login'){
  document.body.classList.add('loggedOut');clearApp();
  const ws=session.workspace,wsTabs=`<div class="wsSwitch" role="group" aria-label="Veri alanı"><button type="button" data-ws="real" class="${ws==='real'?'on':''}">Verilerim</button><button type="button" data-ws="demo" class="${ws==='demo'?'on':''}">Demo alanı</button></div><p class="wsNote">${ws==='demo'?'Örnek verilerle dene. Demo alanı gerçek verilerinden <b>ayrı</b> tutulur.':'Bu tarayıcıda kayıtlı kendi Gather verilerin.'}</p>`;
  let body;
  if(loadError){
    body=`<div class="authAlert"><b>⚠ Veri açılamadı</b><p>${esc(loadError.msg)}</p></div>${loadError.raw?'<button type="button" class="btn soft block" id="rawDl">⇩ Ham veriyi indir (yedek)</button>':''}${loadError.demo?'<button type="button" class="btn danger block" id="demoReset2">Demo verilerini yeniden oluştur</button>':''}`;
  }else if(view==='create'){
    body=`<form id="createForm" novalidate><h2 class="authH">Yerel profil oluştur</h2><p class="sub">Bu profil yalnızca bu tarayıcıda, <b>${ws==='demo'?'demo alanında':'verilerinde'}</b> oluşturulur. Şifre kullanılmaz.</p><label>Ad soyad<input class="field" id="caName" required autocomplete="name" placeholder="Örn. Deniz Yılmaz"></label><label>Kullanıcı adı<input class="field" id="caUser" required autocapitalize="off" placeholder="@deniz"></label><label>E-posta (isteğe bağlı)<input class="field" id="caEmail" type="email" autocomplete="email" inputmode="email"></label><p class="error" id="caErr" role="alert"></p><button class="btn primary block">Profili oluştur ve giriş yap</button><button type="button" class="linkBtn" data-auth="login">← Girişe dön</button></form>`;
  }else if(view==='forgot'){
    body=`<h2 class="authH">Şifremi unuttum</h2><div class="authInfo"><p>Gather şu anda <b>şifresiz demo profil</b> sistemiyle çalışıyor; sıfırlanacak bir şifre yok.</p><p class="sub">E-posta ile şifre sıfırlama, uygulamaya gerçek bir sunucu (backend) bağlandığında etkinleşecek.</p></div><button type="button" class="btn soft block" data-auth="login">← Girişe dön</button>`;
  }else{
    const list=orderedProfiles(),last=session.lastUser[ws],sel=list.some(u=>u.id===last)?last:list[0]?.id;
    body=`${wsTabs}<p class="pickLabel" id="pickLbl">Profilini seç</p><div class="profilePick" role="radiogroup" aria-labelledby="pickLbl">${list.map(u=>`<label class="pick"><input type="radio" name="pick" value="${u.id}" ${u.id===sel?'checked':''}>${avatar(u.id)}<span><b>${esc(u.name)}</b><small>${esc(u.username||'')}</small></span></label>`).join('')||'<div class="empty">Henüz profil yok. Hesap oluştur.</div>'}</div><button type="button" class="btn primary block" id="loginBtn" ${list.length?'':'disabled'}>Giriş yap</button><div class="authLinks"><button type="button" class="linkBtn" data-auth="create">＋ Hesap oluştur</button><button type="button" class="linkBtn" data-auth="forgot">Şifremi unuttum</button></div><details class="futureAuth"><summary>E-posta ve şifre ile giriş (yakında)</summary><input class="field" disabled placeholder="E-posta"><input class="field" disabled type="password" placeholder="Şifre"><button type="button" class="btn soft block" disabled>Giriş yap</button><small>Bu alan, gerçek sunucu bağlandığında etkinleşecek. Şu anda çalışmıyor.</small></details>`;
  }
  $('#auth').innerHTML=`<div class="authCard"><div class="authLogo"><span class="logoMark">G</span>Gather</div><h1>Hoş geldin 👋</h1><p class="sub">Arkadaşlarınla ortak harcamaları paylaş, kolayca hesaplaş.</p>${body}<div class="demoWarn" role="note">🔒 <b>Demo giriş:</b> Profil seçimi şifre kullanmaz ve gerçek güvenlik sağlamaz. Bu cihazı kullanan herkes tüm profillere geçebilir.</div></div>`;
  $$('#auth [data-ws]').forEach(b=>b.addEventListener('click',()=>{loadWorkspace(b.dataset.ws);writeSession();renderAuth()}));
  $$('#auth [data-auth]').forEach(b=>b.addEventListener('click',()=>renderAuth(b.dataset.auth)));
  $('#loginBtn')?.addEventListener('click',()=>{const v=$('#auth input[name=pick]:checked')?.value;if(!v)return toast('Bir profil seç');login(v)});
  $('#rawDl')?.addEventListener('click',()=>download(loadError.raw,'gather-ham-veri-'+today()+'.json'));
  $('#demoReset2')?.addEventListener('click',()=>{if(!confirm('Demo veri alanı yeniden oluşturulsun mu? Gerçek verilerin etkilenmez.'))return;state=GatherDemo.build();persistQuiet();loadWorkspace('demo');renderAuth()});
  $('#createForm')?.addEventListener('submit',e=>{e.preventDefault();const name=$('#caName').value.trim().replace(/\s+/g,' ');let un=$('#caUser').value.trim();const email=$('#caEmail').value.trim();if(name.length<2)return $('#caErr').textContent='Ad soyad gir.';if(!un)return $('#caErr').textContent='Kullanıcı adı gir.';if(!un.startsWith('@'))un='@'+un;if(!/^@[\p{L}\p{N}._-]{2,30}$/u.test(un))return $('#caErr').textContent='Kullanıcı adı 2-30 karakter; harf, rakam, . _ - kullanılabilir.';if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return $('#caErr').textContent='Geçerli bir e-posta gir veya boş bırak.';if(state.users.some(u=>u.username.toLocaleLowerCase('tr')===un.toLocaleLowerCase('tr')))return $('#caErr').textContent='Bu kullanıcı adı zaten kullanılıyor.';if(state.users.some(u=>u.name.toLocaleLowerCase('tr')===name.toLocaleLowerCase('tr')))return $('#caErr').textContent='Bu isimde bir profil zaten var. Girişten seçebilirsin.';const u={id:uid('u'),name,username:un,email,initials:MIG.initials(name)};state.users.push(u);if(!persistQuiet()){state.users.pop();return $('#caErr').textContent='Kaydedilemedi.'}login(u.id)});
}
function login(userId){try{Auth.signIn(userId)}catch(e){return toast(e.message)}document.body.classList.remove('loggedOut');$('#auth').innerHTML='';navDepth=0;render();switchView('home',{replace:true});toast(migrationNotice||`Hoş geldin ${first(meU().name)} 👋`);migrationNotice='';const bad=visibleAudit();if(bad.length)setTimeout(()=>toast(bad.length+' kayıt hesaplamaya alınmadı — Profilim → Veri kontrolü'),2700)}
function logout(){close();Auth.signOut();navDepth=0;try{history.replaceState(null,'',location.pathname+location.search)}catch{}renderAuth();window.scrollTo(0,0)}
function clearApp(){['home','friends','groups','expenses','settle','events','notifications','feed','profile'].forEach(id=>{const el=document.getElementById(id);if(el)el.innerHTML=''});['#rightbar','#sideProfile','#modalBody','#topProfile'].forEach(s=>{const el=$(s);if(el)el.innerHTML=''});$('#pageTitle').textContent='Gather';$('#modalBg').classList.remove('open')}
function download(text,name){const blob=new Blob([text],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function ago(x){if(!x)return '';if(!x.createdAt)return x.date||'';const d=new Date(x.createdAt),m=Math.round((Date.now()-d)/60000);if(isNaN(m))return '';if(m<0)return d.toLocaleDateString('tr-TR');if(m<1)return 'Şimdi';if(m<60)return m+' dk önce';if(m<1440)return Math.round(m/60)+' sa önce';if(m<10080)return Math.round(m/1440)+' gün önce';return d.toLocaleDateString('tr-TR')}
const ACT_ICON={expense_created:'🧾',expense_updated:'✏️',expense_deleted:'🗑',payment:'💸',group_created:'👥',member_added:'➕',visibility_changed:'👁',event_created:'📅',personal_expense:'👤',legacy_group:'👥'};

function unread(){return FEED.unreadCount(state,ME(),today())}

function groupPeople(gid){const g=G(gid);if(!g)return[];const ids=g.members.slice();ACL.nonMemberParties(state,gid).forEach(id=>{if(!ids.includes(id))ids.push(id)});return ids}

<div class="card statCard"><h4>Grup harcamaları</h4><small class="sub">Grup toplamı ve senin payın</small>${grp.length?`<div class="hBars">${grp.map(g=>`<button type="button" class="hBar hBtn" data-group="${g.groupId}"><div class="hLbl"><span>${g.icon} ${esc(g.name)}</span><b>${money(g.total)}</b></div><div class="hTrack"><i style="width:${Math.max(2,Math.round(g.total/gx*100))}%"></i><i class="mine" style="width:${Math.round(g.mine/gx*100)}%"></i></div><small class="sub">Payın ${money(g.mine)}</small></button>`).join('')}</div>`:empty('Gruplarında henüz ortak harcama yok.')}</div>
</div></section>`}

function myGroupBal(gid){const me=ME(),l=myDebts().filter(d=>d.groupId===gid);return l.filter(d=>d.to===me).reduce((a,d)=>a+d.amount,0)-l.filter(d=>d.from===me).reduce((a,d)=>a+d.amount,0)}

function openExpense(opts={}){
  const me=ME(),editing=opts.id?state.expenses.find(e=>e.id===opts.id):null;
  if(opts.id&&!editing)return deny('Harcama bulunamadı.');
  if(editing&&!ACL.canEditExpense(state,me,editing.id))return deny('Bu harcamayı yalnızca oluşturan kişi veya grup yöneticisi düzenleyebilir.');
  const groups=myGroups();if(editing&&editing.groupId&&!groups.some(g=>g.id===editing.groupId)&&G(editing.groupId))groups.push(G(editing.groupId));
  const type=editing?editing.type:(groups.length?'shared':'personal');
  const gid=editing?.groupId||opts.groupId||groups[0]?.id||'';
  const mode=editing?((editing.splitMode==='custom'||(editing.splitMode!=='equal'&&JSON.stringify(editing.splits)!==JSON.stringify(equal(editing.amount,editing.participants.length))))?'custom':'equal'):'equal';
  const cats=['Yeme İçme','Konaklama','Ulaşım','Market','Aktivite','Diğer'];if(editing&&!cats.includes(editing.category))cats.push(editing.category);
  modal(editing?'Harcamayı düzenle':'Yeni harcama',`<form id="expenseForm" novalidate><label class="amountHero"><span>Tutar</span><span class="amtWrap"><em>₺</em><input class="field" id="exAmount" type="number" min="0.01" step="0.01" inputmode="decimal" required placeholder="0,00" value="${editing?(editing.amount/100).toFixed(2):''}" aria-label="Tutar (TL)"></span></label><label class="span2 titleLbl">Açıklama<input class="field" id="exTitle" required maxlength="80" placeholder="Örn. Akşam yemeği" enterkeyhint="next" value="${esc(editing?.title||'')}"></label><div class="splitToggle"><label><input type="radio" name="type" value="shared" ${type==='shared'?'checked':''} ${groups.length?'':'disabled'}>Ortak harcama</label><label><input type="radio" name="type" value="personal" ${type==='personal'?'checked':''}>Kişisel harcama</label></div>${groups.length?'':'<p class="sub">Ortak harcama için önce bir grup oluştur.</p>'}<div class="formGrid" style="margin-top:12px"><label class="shared">Grup<select id="exGroup">${groups.map(g=>`<option value="${g.id}" ${g.id===gid?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label><label class="shared">Etkinlik (varsa)<select id="exEvent"></select></label><label class="shared span2">Ödeyen kişi<select id="exPayer"></select><small class="hint">Ödeyen kişinin harcamaya katılması zorunlu değil.</small></label><div class="span2 shared"><div class="sectionHead" style="margin:4px 0 8px"><b>Katılanlar</b><div class="splitToggle mini"><label><input type="radio" name="smode" value="equal" ${mode==='equal'?'checked':''}>Eşit</label><label><input type="radio" name="smode" value="custom" ${mode==='custom'?'checked':''}>Özel tutar</label></div></div><div class="peopleTools"><button type="button" class="linkBtn" data-people="all">Tümünü seç</button><button type="button" class="linkBtn" data-people="none">Temizle</button></div><div class="checks shareList" id="exPeople"></div><p class="splitInfo" id="splitInfo" aria-live="polite"></p></div><label>Tarih<input class="field" id="exDate" type="date" required value="${editing?.date||today()}"></label><label>Kategori<select id="exCat">${cats.map(c=>`<option ${editing?.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label></div>${editing?`<p class="sub">Ekleyen: ${editing.createdByUserId?esc(U(editing.createdByUserId).name):'bilinmiyor (eski kayıt)'}${editing.updatedByUserId?' · Son düzenleyen: '+esc(U(editing.updatedByUserId).name):''}</p>`:''}<p class="error" id="formError" role="alert"></p><div class="actions"><button type="button" class="btn soft" data-close>Vazgeç</button><button class="btn primary">${editing?'Değişiklikleri kaydet':'Harcamayı kaydet'}</button></div></form>`);
  const custom={};if(editing&&editing.type==='shared')editing.participants.forEach((id,i)=>custom[id]=(editing.splits[i]/100).toFixed(2));
  const curType=()=>$('input[name=type]:checked').value,curMode=()=>$('input[name=smode]:checked').value;
  function memberIds(g){const ids=g?g.members.slice():[];if(editing&&editing.groupId===g?.id)[editing.payer,...editing.participants].forEach(id=>{if(!ids.includes(id))ids.push(id)});return ids}
  function fillGroup(init){const g=G($('#exGroup').value),ids=memberIds(g),payer=init&&editing?editing.payer:(ids.includes(me)?me:ids[0]);$('#exPayer').innerHTML=ids.map(id=>`<option value="${id}" ${id===payer?'selected':''}>${esc(U(id).name)}${g&&!g.members.includes(id)?' (eski üye)':''}</option>`).join('');const evs=state.events.filter(v=>v.groupId===g?.id&&ACL.canViewEvent(state,me,v.id)),evSel=init?(editing?.eventId||opts.eventId||''):'';$('#exEvent').innerHTML=`<option value="">Etkinlik yok</option>`+evs.map(v=>`<option value="${v.id}" ${v.id===evSel?'selected':''}>${v.emoji} ${esc(v.name)}</option>`).join('');const checked=init&&editing&&editing.type==='shared'?editing.participants:(init&&opts.eventId?EVT.participants(state,opts.eventId):g?g.members:[]);renderPeople(ids,checked)}
  function renderPeople(ids,checked){$('#exPeople').innerHTML=ids.map(id=>`<label class="check shareRow"><input type="checkbox" value="${id}" ${checked.includes(id)?'checked':''}>${avatar(id)}<span class="grow">${esc(U(id).name)}</span><input class="field shareAmt" data-share="${id}" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0,00" value="${custom[id]||''}" aria-label="${esc(U(id).name)} payı"></label>`).join('')||'<p class="sub">Bu grupta üye yok.</p>';updateSplit()}
  function updateSplit(){const isCustom=curMode()==='custom';$('#exPeople').classList.toggle('custom',isCustom);const amt=cents($('#exAmount').value),sel=$$('#exPeople input[type=checkbox]:checked').map(x=>x.value);$$('#exPeople .shareAmt').forEach(i=>{i.disabled=!isCustom||!sel.includes(i.dataset.share)});let t='';if(!sel.length)t='En az bir katılımcı seç.';else if(!amt||amt<=0)t=`${sel.length} kişi seçildi.`;else if(!isCustom){const s=equal(amt,sel.length);t=s[0]===s[s.length-1]?`Kişi başı ${money(s[0])}`:`Kişi başı ${money(s[s.length-1])} – ${money(s[0])} (kuruş farkı ilk kişilere eklenir)`}else{const sum=sel.reduce((a,id)=>a+(cents($(`[data-share="${id}"]`).value)||0),0),diff=amt-sum;t=`Dağıtılan ${money(sum)} / ${money(amt)} · ${diff===0?'✓ Tamam':diff>0?'Kalan '+money(diff):'Fazla '+money(-diff)}`;$('#splitInfo').className='splitInfo '+(diff===0?'ok':'bad')}if(!isCustom)$('#splitInfo').className='splitInfo';$('#splitInfo').textContent=t}
  const toggleType=()=>$$('#expenseForm .shared').forEach(x=>x.classList.toggle('hidden',curType()==='personal'));
  $$('input[name=type]').forEach(r=>r.onchange=toggleType);$$('input[name=smode]').forEach(r=>r.onchange=updateSplit);
  $('#exGroup').onchange=()=>fillGroup(false);$('#exAmount').oninput=updateSplit;$('#exPeople').addEventListener('input',e=>{if(e.target.dataset.share)custom[e.target.dataset.share]=e.target.value;updateSplit()});$('#exPeople').addEventListener('change',updateSplit);$$('#expenseForm [data-people]').forEach(b=>b.onclick=()=>{$$('#exPeople input[type=checkbox]').forEach(c=>c.checked=b.dataset.people==='all');updateSplit()});
  if(groups.length)fillGroup(true);toggleType();
  $('#expenseForm').onsubmit=e=>{e.preventDefault();const err=m=>{$('#formError').textContent=m;return false};
    if(editing&&!ACL.canEditExpense(state,me,editing.id))return err('Bu harcamayı düzenleme yetkin yok.');
    const t=curType(),title=$('#exTitle').value.trim(),amount=cents($('#exAmount').value),date=$('#exDate').value;
    if(!title)return err('Harcama adı gir.');if(amount===null||amount<=0)return err('Geçerli bir tutar gir (ör. 1250,50).');if(!date)return err('Tarih seç.');
    let obj={...(editing||{}),id:editing?.id||uid('e'),title,amount,date,category:$('#exCat').value,type:t};
    if(t==='shared'){const groupId=$('#exGroup').value,g=G(groupId);if(!g)return err('Ortak harcama için bir grup seç.');if(!ACL.canAddExpense(state,me,groupId))return err('Bu gruba harcama ekleme yetkin yok (üye değilsin).');
      const participants=$$('#exPeople input[type=checkbox]:checked').map(x=>x.value);if(!participants.length)return err('En az bir katılımcı seçmelisin.');
      let splits;if(curMode()==='custom'){splits=participants.map(id=>cents($(`[data-share="${id}"]`).value));if(splits.some(x=>x===null||x<0))return err('Her katılımcı için geçerli bir pay gir (0 veya üzeri).');const sum=splits.reduce((a,x)=>a+x,0);if(sum!==amount)return err(`Payların toplamı (${money(sum)}) tutara (${money(amount)}) eşit olmalı. Fark: ${money(amount-sum)}`);if(splits.every(x=>x===0))return err('Paylar sıfır olamaz.')}else splits=equal(amount,participants.length);
      const eventId=$('#exEvent').value||null;if(eventId&&V(eventId)?.groupId!==groupId)return err('Seçilen etkinlik bu gruba ait değil.');
      Object.assign(obj,{groupId,eventId,payer:$('#exPayer').value,participants,splits,splitMode:curMode()});
      const allowed=memberIds(g),vErr=ENG.validateExpense(obj,{groupMembers:allowed});if(vErr.length)return err(vErr.join(' · '));
    }else{const owner=editing&&editing.type==='personal'?editing.payer:me;Object.assign(obj,{groupId:null,eventId:editing&&editing.type==='personal'?editing.eventId||null:null,payer:owner,participants:[owner],splits:[amount],splitMode:'equal'});const vErr=ENG.validateExpense(obj);if(vErr.length)return err(vErr.join(' · '))}
    if(editing){obj.updatedAt=new Date().toISOString();obj.updatedByUserId=me}else{obj.createdByUserId=me;obj.createdAt=new Date().toISOString()}
    const next={...state,expenses:editing?state.expenses.map(x=>x.id===editing.id?obj:x):[...state.expenses,obj]};
    if(editing&&!confirmOverpay(next,[editing.groupId,obj.groupId]))return;
    state.expenses=next.expenses;
    logAct(obj.type==='shared'?{type:editing?'expense_updated':'expense_created',groupId:obj.groupId,eventId:obj.eventId,expenseId:obj.id,involved:[obj.payer,...obj.participants,...(editing&&editing.type==='shared'?[editing.payer,...editing.participants]:[])],text:`${first(meU().name)}, ${obj.title} harcamasını ${editing?'güncelledi':'ekledi'}`}:{type:'personal_expense',expenseId:obj.id,text:`${obj.title} kişisel harcaması ${editing?'güncellendi':'eklendi'}`});
    close();save(editing?'Harcama güncellendi ✓':'Harcama eklendi ✨')};
}
/* Düzenleme/silme sonrası, yapılmış ödemeler harcama borcunu aşıyorsa kullanıcıyı uyar. */
function confirmOverpay(next,gids){const key=d=>d.groupId+d.from+d.to;const issues=[];[...new Set(gids.filter(Boolean))].forEach(g=>{const before=new Set(ENG.overpaidPairs(state,g).map(key));ENG.overpaidPairs(next,g).filter(d=>!before.has(key(d))).forEach(d=>issues.push(d))});if(!issues.length)return true;return confirm(`Dikkat: Bu işlemden sonra yapılmış ödemeler harcama borcunu aşıyor.\n\n${issues.map(d=>`${U(d.to).name} daha önce ödeme yapmış; şimdi ${U(d.from).name} kişisine ${money(d.amount)} borçlu görünecek (${G(d.groupId)?.name||''}).`).join('\n')}\n\nÖdeme kayıtları silinmez. Devam edilsin mi?`)}
function deleteExpense(id){const me=ME(),e=state.expenses.find(x=>x.id===id);if(!e)return deny('Harcama bulunamadı.');if(!ACL.canDeleteExpense(state,me,id))return deny('Bu harcamayı yalnızca oluşturan kişi veya grup yöneticisi silebilir.');const next={...state,expenses:state.expenses.filter(x=>x.id!==id)};const k=d=>d.groupId+d.from+d.to,before=new Set(ENG.overpaidPairs(state,e.groupId).map(k)),issues=e.groupId?ENG.overpaidPairs(next,e.groupId).filter(d=>!before.has(k(d))):[];if(!confirm(`"${e.title}" (${money(e.amount)}) silinsin mi?`+(issues.length?`\n\nDikkat: Bu gruptaki ödemeler harcama borcunu aşacak; ${issues.map(d=>`${U(d.from).name} → ${U(d.to).name} ${money(d.amount)}`).join(', ')} ters bakiye oluşacak. Ödeme kayıtları silinmez.`:'')))return;state.expenses=next.expenses;logAct(e.type==='shared'?{type:'expense_deleted',groupId:e.groupId,eventId:e.eventId,involved:[e.payer,...e.participants],text:`${first(meU().name)}, ${e.title} harcamasını sildi (${money(e.amount)})`}:{type:'personal_expense',text:`${e.title} kişisel harcaması silindi`});close();save('Harcama silindi')}

function openFriend(){modal('Arkadaş ekle',`<form id="friendForm"><label>Ad soyad<input class="field" id="frName" required placeholder="Örn. Deniz Yılmaz"></label><label>Kullanıcı adı<input class="field" id="frUser" required placeholder="@deniz" autocapitalize="off"></label><p class="sub">Eklenen kişi bu cihazda ayrı bir profil olarak da seçilebilir.</p><p class="error" id="friendErr"></p><div class="actions"><button type="button" class="btn soft" data-close>Vazgeç</button><button class="btn primary">Arkadaş ekle</button></div></form>`,true);$('#friendForm').onsubmit=e=>{e.preventDefault();const name=$('#frName').value.trim().replace(/\s+/g,' ');let username=$('#frUser').value.trim();if(!username.startsWith('@'))username='@'+username;if(state.users.some(u=>u.username.toLocaleLowerCase('tr')===username.toLocaleLowerCase('tr')))return $('#friendErr').textContent='Bu kullanıcı adı zaten ekli.';if(state.users.some(u=>u.name.toLocaleLowerCase('tr')===name.toLocaleLowerCase('tr')))return $('#friendErr').textContent='Bu isimde bir kişi zaten var.';state.users.push({id:uid('u'),name,username,email:'',initials:MIG.initials(name)});close();save('Arkadaş eklendi 💜')}}

/* ---------- GRUP (oluştur + düzenle + görünürlük) ---------- */

  $('#editGroupBtn')&&($('#editGroupBtn').onclick=()=>openGroup(id));$('#visEditBtn')&&($('#visEditBtn').onclick=()=>openGroup(id));$('#grAddExp').onclick=()=>openExpense({groupId:id});
  $('#addMemberBtn')&&($('#addMemberBtn').onclick=()=>{if(!ACL.canManageGroup(state,me,id))return deny('Üye eklemek için grup yöneticisi olmalısın.');const nid=$('#addMemberSel').value;if(!nid||g.members.includes(nid))return;g.members.push(nid);logAct({type:'member_added',groupId:id,involved:[nid],text:`${U(nid).name}, ${g.name} grubuna eklendi`});save('Üye gruba eklendi');groupDetail(id)});
  $$('[data-remove-member]').forEach(b=>b.onclick=()=>{const mid=b.dataset.removeMember,chk=ACL.canRemoveMember(state,me,id,mid);if(!chk.ok)return deny(chk.reason);if(!confirm(`${U(mid).name} gruptan çıkarılsın mı?${state.expenses.some(e=>e.groupId===id&&(e.payer===mid||e.participants.includes(mid)))?' Geçmiş harcama kayıtları korunur.':''}`))return;g.members=g.members.filter(x=>x!==mid);g.admins=g.admins.filter(x=>x!==mid);save('Üye gruptan çıkarıldı');groupDetail(id)});
  $$('[data-toggle-admin]').forEach(b=>b.onclick=()=>{if(!ACL.canManageGroup(state,me,id))return deny('Yetkin yok.');const mid=b.dataset.toggleAdmin;if(g.admins.includes(mid)){if(g.admins.length<2)return deny('Grubun en az bir yöneticisi olmalı.');if(mid===me&&!confirm('Kendi yöneticiliğini bırakmak istediğine emin misin?'))return;g.admins=g.admins.filter(x=>x!==mid)}else g.admins.push(mid);save('Rol güncellendi');ACL.canViewGroup(state,me,id)?groupDetail(id):close()})}
function personDetail(id){const me=ME(),u=U(id),groups=myGroups().filter(g=>g.members.includes(id)),inv=(e,x)=>e.payer===x||e.participants.includes(x),ex=myExpenses().filter(e=>e.type==='shared'&&inv(e,id)&&inv(e,me)),net=friendNet(id);modal(u.name,`<div class="profileHero">${avatar(id,true)}<div class="grow"><h2>${esc(u.name)}</h2><p>${esc(u.username)}</p><span class="badge">${groups.length} ortak grup</span></div>${id!==me?'<button class="btn danger" id="deleteFriendDetail">Arkadaşı sil</button>':''}</div><div class="balanceHero"><div class="balanceSide"><span class="sub">Senin alacağın</span><strong class="pos">${money(net.receivable)}</strong></div><div style="font-size:24px">⇄</div><div class="balanceSide"><span class="sub">Senin borcun</span><strong class="neg">${money(net.payable)}</strong></div></div>${net.byGroup.length?`<div class="card" style="margin-bottom:12px"><h3>Grup bazında durum</h3>${net.byGroup.map(b=>`<div class="row"><span class="grow">${esc(G(b.groupId)?.name||'Grupsuz')}</span><b class="${b.amount>0?'pos':'neg'}">${b.amount>0?money(b.amount)+' alacağın':money(-b.amount)+' borcun'}</b></div>`).join('')}</div>`:''}<div class="card"><h3>Ortak gruplar</h3><p>${groups.map(g=>g.icon+' '+esc(g.name)).join(' · ')||'Ortak grup yok'}</p></div><div class="card" style="margin-top:12px"><h3>Ortak harcamalar</h3>${expenseRows(ex,false)}</div><p class="hiddenNote">🔒 Bu kişinin diğer borç/alacakları ve kişisel bilgileri sana gösterilmez.</p>`);$('#deleteFriendDetail')&&($('#deleteFriendDetail').onclick=()=>deleteFriend(id))}
function deleteFriend(id){const u=U(id);if(id===ME())return deny('Kendi profilini buradan silemezsin.');const has=state.expenses.some(e=>e.payer===id||e.participants.includes(id))||state.payments.some(p=>p.from===id||p.to===id);if(!confirm(`${u.name} silinsin mi?\n\nBu kişi tüm grup üyeliklerinden çıkarılır ve profil olarak seçilemez.${has?'\nGeçmiş harcama ve ödeme kayıtları korunur (isim "Bilinmeyen" görünür).':''}`))return;state.groups.forEach(g=>{g.members=g.members.filter(x=>x!==id);g.admins=(g.admins||[]).filter(x=>x!==id);if(!g.admins.length&&g.members.length)g.admins=[g.members[0]]});state.users=state.users.filter(x=>x.id!==id);close();save('Arkadaş silindi')}
function renderNotifications(){const me=ME(),r=myNotifs(),notices=r.notices.slice().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))),rem=r.reminders.slice().sort((a,b)=>a.event.start.localeCompare(b.event.start)),n=[...notices,...rem].filter(x=>!x.read).length;
const extra=x=>{const e=x.n.expenseId&&state.expenses.find(y=>y.id===x.n.expenseId);if(e&&e.type==='shared'){const i=e.participants.indexOf(me);if(i>-1)return ` · Payın ${money(e.splits[i])}`;if(e.payer===me)return ` · Sen ödedin ${money(e.amount)}`}return ''};

$('#notifications').innerHTML=`<div class="sectionHead"><div><h3>Bildirimler</h3><p>Yalnızca sana gönderilen bildirimler</p></div>${n?`<button type="button" class="btn soft" data-readall>Tümünü okundu say (${n})</button>`:'<span class="badge">Hepsi okundu</span>'}</div><div class="nList">${notices.map(row).join('')||'<div class="card empty">Bildirimin yok.</div>'}</div>${rem.length?`<h3 class="nHead">Yaklaşan etkinlikler</h3><div class="nList">${rem.map(row).join('')}</div>`:''}`}
function exportJSON(){download(JSON.stringify(state,null,2),(session.workspace==='demo'?'gather-demo-yedek-':'gather-yedek-')+today()+'.json');toast('JSON yedeği indirildi')}
function importJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);const res=MIG.migrate(x,{addDemoUsers:session.workspace!=='demo'}),errs=MIG.verify(x,res.data);if(errs.length)throw Error(errs.join('; '));if(!confirm(`Bu yedek ${session.workspace==='demo'?'demo alanındaki':'mevcut'} verilerinin YERİNE yüklenecek (${res.data.expenses.length} harcama, ${res.data.groups.length} grup). Mevcut halini önce "JSON indir" ile yedeklemeni öneririz.\n\nDevam edilsin mi?`)){e.target.value='';return}state=res.data;close();if(!state.users.some(u=>u.id===ME())){persistQuiet();toast('Yedek yüklendi. Aktif profil yedekte yok; yeniden giriş yap.');return logout()}save('Yedek başarıyla geri yüklendi')}catch(err){toast('Geçersiz Gather yedek dosyası'+(err&&err.message?': '+err.message:''))}e.target.value=''};r.readAsText(f)}
function titleFor(id){return {home:`Merhaba ${first(meU().name)} 👋`,feed:'Sosyal akış',friends:'Arkadaşlar',groups:'Gruplarım',expenses:'Harcamalar',settle:'Bakiyeler',events:'Etkinlikler',notifications:'Bildirimler',profile:'Profilim'}[id]||'Gather'}
function switchView(id,opt={}){if(!document.getElementById(id))id='home';$$('.view').forEach(v=>v.classList.toggle('active',v.id===id));$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===id));const tab=PRIMARY.includes(id)?id:(PARENT[id]||'home');$$('#mnav [data-view]').forEach(b=>{const on=b.dataset.view===tab;b.classList.toggle('active',on);b.setAttribute('aria-current',on?'page':'false')});document.body.dataset.view=id;document.body.classList.toggle('secondary',!PRIMARY.includes(id));$('#pageTitle').textContent=titleFor(id);if(opt.history!==false){const h='#'+id;if(location.hash!==h){if(opt.replace){history.replaceState(null,'',h);}else{history.pushState(null,'',h);navDepth++}}}if(opt.scroll!==false)window.scrollTo(0,0)}

/* ---------- OLAY YÖNETİMİ (tek merkezden; modal içindeki butonlar dahil) ---------- */
document.addEventListener('click',e=>{const t=e.target;if(!state||!ME())return;let b;
  if(t.closest('[data-close]'))return close();
  if(b=t.closest('[data-logout]'))return logout();
  if(b=t.closest('[data-switch-profile]')){if(!confirm('Profil değiştirmek için oturum kapatılacak. Devam edilsin mi?'))return;return logout()}
  if(b=t.closest('[data-open]'))return ({expense:()=>openExpense(),friend:openFriend,group:()=>openGroup(),payment:()=>openPayment(),event:()=>openEvent(),profile:openProfile,backup:openBackup}[b.dataset.open])();
  if(b=t.closest('[data-tab]')){settleTab=b.dataset.tab;if(!b.closest('[data-go]')){renderSettle();return}}
  if(b=t.closest('[data-go]')){close();return switchView(b.dataset.go)}
  if(b=t.closest('[data-back]'))return goBack();
  if(b=t.closest('[data-readall]')){FEED.markRead(state,ME(),[...myNotifs().notices,...myNotifs().reminders].map(x=>x.key));return save('Tüm bildirimler okundu')}
  if(b=t.closest('[data-notif]')){const r=myNotifs(),x=[...r.notices,...r.reminders].find(y=>y.key===b.dataset.notif);if(!x)return deny('Bu bildirime erişimin yok.');FEED.markRead(state,ME(),[x.key]);persistQuiet();render();return openTarget(x.kind==='reminder'?{type:'event',id:x.event.id}:FEED.target(x.n))}
  if(b=t.closest('[data-feed]')){const a=myActivity().find(y=>y.id===b.dataset.feed);if(!a)return deny('Bu kayda erişimin yok.');return openTarget(FEED.target(a))}
  if(b=t.closest('[data-add-nonmember]')){const gid=b.dataset.group2,nid=b.dataset.addNonmember,g=G(gid);if(!ACL.canManageGroup(state,ME(),gid))return deny('Üye eklemek için grup yöneticisi olmalısın.');if(g&&!g.members.includes(nid)){g.members.push(nid);logAct({type:'member_added',groupId:gid,involved:[nid],text:`${U(nid).name}, ${g.name} grubuna eklendi`});save('Üye gruba eklendi');return groupDetail(gid)}return}
  if(b=t.closest('[data-edit-expense]'))return openExpense({id:b.dataset.editExpense});
  if(b=t.closest('[data-delete-expense]'))return deleteExpense(b.dataset.deleteExpense);
  if(b=t.closest('[data-quickpay]'))return openPayment(JSON.parse(b.dataset.quickpay));
  if(b=t.closest('[data-person]'))return personDetail(b.dataset.person);
  if(b=t.closest('[data-delete-friend]'))return deleteFriend(b.dataset.deleteFriend);
  if(b=t.closest('[data-group]'))return groupDetail(b.dataset.group);
  if(b=t.closest('[data-event]'))return eventDetail(b.dataset.event);
});

(function pwa(){const web=location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname);if(!web)return;const add=(rel,href,extra={})=>{const l=document.createElement('link');l.rel=rel;l.href=href;Object.entries(extra).forEach(([k,v])=>l.setAttribute(k,v));document.head.appendChild(l)};add('manifest','manifest.webmanifest');add('apple-touch-icon','icons/apple-touch-icon-180.png');add('icon','icons/icon-32.png',{type:'image/png',sizes:'32x32'});if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))})();
